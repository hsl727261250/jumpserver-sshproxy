# 复制为 config.yml 后按需修改。
# CORE_HOST 和 BOOTSTRAP_TOKEN 由 .env 提供，写在这里也会被环境变量覆盖。
# SSH 固定监听 0.0.0.0:1024。

# 向 JumpServer 注册时使用的名称。不填时按主机名生成。
# NAME: sshproxy

# 日志级别 [DEBUG, INFO, WARN, ERROR]
LOG_LEVEL: INFO

# 调用 Core API 的超时时间, 单位秒
HTTP_REQUEST_TIMEOUT: 30

# 向 Core 注册时使用的终端类型。Core 没有 sshproxy 类型。
# 状态上报使用这个类型下的独立组件。配置 ASSET_ID 后会执行 kill_session。
TERMINAL_TYPE: koko

# direct-tcpip 拨号超时, 单位秒
FORWARD_DIAL_TIMEOUT: 15

# 没有转发流量时的空闲断开时间, 单位分钟。0 表示不限制。
MAX_IDLE_MINUTES: 30

# 单条 SSH 连接的最长会话时间, 单位小时。0 表示不限制。
MAX_SESSION_HOURS: 24

# 创建 Core 会话时使用的资产 ID。为空则不创建会话。
# 资产需要位于组件服务账号的默认组织。
# ASSET_ID:
